name: Build AutoSwipe AI APK

on:
  push:
    branches: ["main", "feature/video-end-detection"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.AUTOSWIPE_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.AUTOSWIPE_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.AUTOSWIPE_KEY_PASSWORD }}
      STORE_PASSWORD: ${{ secrets.AUTOSWIPE_STORE_PASSWORD }}
      SIGNING_CONFIGURED: ${{ secrets.AUTOSWIPE_KEYSTORE_BASE64 != '' && secrets.AUTOSWIPE_KEY_ALIAS != '' && secrets.AUTOSWIPE_KEY_PASSWORD != '' && secrets.AUTOSWIPE_STORE_PASSWORD != '' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Decode persistent release keystore
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/autoswipe-release.jks"
          test -s "$RUNNER_TEMP/autoswipe-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/autoswipe-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.SIGNING_CONFIGURED == 'true'
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed release APK
        if: env.SIGNING_CONFIGURED == 'true'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Build debug APK (temporary fallback)
        if: env.SIGNING_CONFIGURED != 'true'
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload signed release APK
        if: env.SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoSwipeAI-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK (temporary fallback)
        if: env.SIGNING_CONFIGURED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AutoSwipeAI-debug-temporary
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Explain signing setup when secrets are missing
        if: env.SIGNING_CONFIGURED != 'true'
        run: |
          echo "::warning::Persistent signing is not configured. This temporary debug APK may not update a build signed with a different key."
          echo "Add the four AUTOSWIPE_* repository Actions secrets to enable signed release APKs."
